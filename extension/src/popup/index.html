<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Novel Compass settings</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="popup-shell" aria-labelledby="popup-title">
      <header class="brand-header">
        <span class="brand-mark" aria-hidden="true">NC</span>
        <span>
          <strong id="popup-title">Novel Compass</strong>
          <small>for Novel Updates</small>
        </span>
        <span class="status-pill" id="status-pill" aria-live="polite">Loading</span>
      </header>

      <section class="setting-row setting-row--primary">
        <span>
          <label for="extension-enabled">Use Novel Compass</label>
          <small>Restyle Novel Updates pages</small>
        </span>
        <input
          class="switch"
          id="extension-enabled"
          type="checkbox"
          role="switch"
          aria-describedby="enabled-hint"
        />
        <span class="sr-only" id="enabled-hint">Turn the Novel Compass interface on or off</span>
      </section>

      <section class="settings-group" aria-labelledby="appearance-title">
        <h2 id="appearance-title">Appearance</h2>
        <fieldset>
          <legend>Theme</legend>
          <div class="segmented-control">
            <label><input type="radio" name="theme" value="system" />System</label>
            <label><input type="radio" name="theme" value="light" />Light</label>
            <label><input type="radio" name="theme" value="dark" />Dark</label>
          </div>
        </fieldset>
        <fieldset>
          <legend>Default page view</legend>
          <div class="segmented-control segmented-control--two">
            <label>
              <input type="radio" name="page-mode" value="replacement" />
              Novel Compass
            </label>
            <label><input type="radio" name="page-mode" value="original" />Original</label>
          </div>
        </fieldset>
      </section>

      <p class="save-status" id="save-status" aria-live="polite"></p>

      <nav class="quick-links" aria-label="Quick links">
        <a href="https://www.novelupdates.com/" data-external>Novel Updates <span>↗</span></a>
        <a href="https://www.novelupdates.com/series-finder/" data-external
          >Find novels <span>↗</span></a
        >
        <a href="https://www.novelupdates.com/series-ranking/" data-external
          >Rankings <span>↗</span></a
        >
      </nav>

      <footer>
        Changes apply when a Novel Updates page is refreshed.
      </footer>
    </main>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
