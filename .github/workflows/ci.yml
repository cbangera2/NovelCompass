name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install Python dependencies
        run: python -m pip install --requirement requirements-ci.txt

      - name: Compile Python
        run: python -m compileall -q src build_static_export.py scripts/create_ci_dataset.py

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Run non-mutating quality checks
        run: pnpm --dir web run check

      - name: Generate fixture static projection
        run: |
          python -m scripts.create_ci_dataset "${RUNNER_TEMP}/fixture.sqlite"
          python build_static_export.py \
            --db "${RUNNER_TEMP}/fixture.sqlite" \
            --output web/public/data \
            --candidate-limit 10
          python build_static_export.py \
            --output web/public/data \
            --verify-only

      - name: Type-check and build static site
        env:
          VITE_DATA_MODE: static
        run: |
          PAGES_BASE="/${GITHUB_REPOSITORY#*/}/"
          pnpm --dir web exec tsc
          pnpm --dir web exec vite build --base="${PAGES_BASE}"

      - name: Verify Pages base path and static payload
        run: |
          PAGES_BASE="/${GITHUB_REPOSITORY#*/}/"
          test -s web/dist/data/manifest.json
          test -s web/dist/data/catalog.json
          grep -q "${PAGES_BASE}assets/" web/dist/index.html
          grep -q "${PAGES_BASE}favicon.svg" web/dist/index.html
