name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - 'web/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Fetch pre-built dataset for the frontend snapshot
        run: |
          git clone --depth 1 https://github.com/cbangera2/novelcompass-data.git web/public/data
          # The clone's history blows past the 25 MiB per-asset limit; the
          # working tree is all the build needs.
          rm -rf web/public/data/.git

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Install worker dependencies
        run: npm ci
        working-directory: workers

      - name: Typecheck worker
        run: npx tsc --noEmit
        working-directory: workers

      - name: Build frontend
        run: pnpm --dir web run build

      - name: Verify deployment payload
        run: |
          test -s web/dist/index.html
          test -s web/dist/data/manifest.json
          # No single asset may exceed the 25 MiB Workers limit.
          oversized="$(find web/dist -type f -size +25M)"
          if [[ -n "${oversized}" ]]; then
            echo "::error::Oversized assets for Workers:${oversized}"
            exit 1
          fi

      - name: Apply D1 migrations
        # Migrations are idempotent (CREATE TABLE IF NOT EXISTS) and the schema
        # rarely changes. Cloudflare enforces the free tier's daily row-read
        # cap as a hard failure, so a quota-exhausted account would otherwise
        # block deploys on a no-op step. Schema changes need
        # `npm run db:migrate` to be run manually when this warns.
        run: npx wrangler d1 migrations apply novelcompass --remote || echo "::warning::D1 migrations could not be applied (daily row-read limit?). Schema may be stale; run 'npm run db:migrate' in workers/ manually."
        continue-on-error: true
        working-directory: workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        working-directory: workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
