name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install exporter dependencies
        run: python -m pip install --requirement requirements-ci.txt

      - name: Select static data source
        id: static-source
        env:
          STATIC_DATA_URL: ${{ vars.STATIC_DATA_URL }}
          STATIC_DATA_SHA256: ${{ vars.STATIC_DATA_SHA256 }}
        run: |
          if [[ -z "${STATIC_DATA_URL}" && -z "${STATIC_DATA_SHA256}" ]]; then
            echo "mode=committed" >> "${GITHUB_OUTPUT}"
            echo "Using the normalized static snapshot committed under web/public/data."
            exit 0
          fi
          if [[ -z "${STATIC_DATA_URL}" || -z "${STATIC_DATA_SHA256}" ]]; then
            echo "::error::Set both STATIC_DATA_URL and STATIC_DATA_SHA256, or leave both unset to deploy the committed snapshot."
            exit 1
          fi
          if [[ ! "${STATIC_DATA_URL}" =~ ^https:// ]]; then
            echo "::error::STATIC_DATA_URL must use HTTPS."
            exit 1
          fi
          if [[ ! "${STATIC_DATA_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::STATIC_DATA_SHA256 must be a lowercase 64-character SHA-256 digest."
            exit 1
          fi
          echo "mode=external" >> "${GITHUB_OUTPUT}"

      - name: Fetch pre-built dataset from data repository
        if: steps.static-source.outputs.mode == 'committed'
        run: |
          git clone --depth 1 https://github.com/cbangera2/novelcompass-data.git web/public/data

      - name: Download and verify database
        if: steps.static-source.outputs.mode == 'external'
        env:
          STATIC_DATA_URL: ${{ vars.STATIC_DATA_URL }}
          STATIC_DATA_SHA256: ${{ vars.STATIC_DATA_SHA256 }}
        run: |
          curl --fail --location --proto '=https' --retry 3 \
            --output "${RUNNER_TEMP}/recommender.sqlite" \
            "${STATIC_DATA_URL}"
          echo "${STATIC_DATA_SHA256}  ${RUNNER_TEMP}/recommender.sqlite" | sha256sum --check --strict

      - name: Generate and validate normalized static data
        if: steps.static-source.outputs.mode == 'external'
        env:
          STATIC_MAX_NOVELS: ${{ vars.STATIC_MAX_NOVELS }}
          STATIC_CATALOG_LIMIT: ${{ vars.STATIC_CATALOG_LIMIT }}
        run: |
          export_args=()
          if [[ -n "${STATIC_MAX_NOVELS}" ]]; then
            if [[ ! "${STATIC_MAX_NOVELS}" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::STATIC_MAX_NOVELS must be a positive integer when set."
              exit 1
            fi
            export_args+=(--max-novels "${STATIC_MAX_NOVELS}")
          fi
          if [[ -n "${STATIC_CATALOG_LIMIT}" ]]; then
            if [[ ! "${STATIC_CATALOG_LIMIT}" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::STATIC_CATALOG_LIMIT must be a positive integer when set."
              exit 1
            fi
            export_args+=(--catalog-limit "${STATIC_CATALOG_LIMIT}")
          fi
          python build_static_export_parallel.py \
            --db "${RUNNER_TEMP}/recommender.sqlite" \
            --output web/public/data \
            "${export_args[@]}"

      - name: Validate normalized static data
        run: python build_static_export_parallel.py --output web/public/data --verify-only

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Build static site
        env:
          VITE_DATA_MODE: static
        run: |
          PAGES_BASE="/${GITHUB_REPOSITORY#*/}/"
          pnpm --dir web exec tsc
          pnpm --dir web exec vite build --base="${PAGES_BASE}"

      - name: Verify deployment payload
        run: |
          PAGES_BASE="/${GITHUB_REPOSITORY#*/}/"
          test -s web/dist/data/manifest.json
          test -s web/dist/data/catalog.json
          grep -q "${PAGES_BASE}assets/" web/dist/index.html
          grep -q "${PAGES_BASE}favicon.svg" web/dist/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
